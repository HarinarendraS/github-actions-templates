name: Reusable Container App Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub deployment environment"
        required: true
        type: string

      image_tag:
        description: "Container image tag"
        required: true
        type: string

jobs:

  deploy:

    name: Deploy - ${{ inputs.environment }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display Deployment Configuration
        shell: bash
        run: |
          echo "Environment      : ${{ inputs.environment }}"
          echo "Resource Group   : ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "Container App    : ${{ vars.CONTAINER_APP_NAME }}"
          echo "ACR              : ${{ vars.ACR_NAME }}"
          echo "Image Repository : ${{ vars.IMAGE_REPOSITORY }}"
          echo "Image Tag        : ${{ inputs.image_tag }}"

      - name: Capture Current Image
        shell: bash
        run: |
          CURRENT_IMAGE=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Current image: $CURRENT_IMAGE"

      - name: Deploy Image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_REPOSITORY }}:${{ inputs.image_tag }}"

          echo "Deploying: $IMAGE"

          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --output none

      - name: Validate Deployment
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="${{ vars.ACR_NAME }}.azurecr.io/${{ vars.IMAGE_REPOSITORY }}:${{ inputs.image_tag }}"

          DEPLOYED_IMAGE=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Expected : $EXPECTED_IMAGE"
          echo "Actual   : $DEPLOYED_IMAGE"

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Deployment validation failed"
            exit 1
          fi

          echo "Deployment successful"
