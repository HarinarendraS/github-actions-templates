name: Reusable Container App Deployment

on:
  workflow_call:
    inputs:

      environment:
        description: "GitHub deployment environment"
        required: true
        type: string

      image_tag:
        description: "Container image tag"
        required: true
        type: string


jobs:

  deploy:

    name: Deploy - ${{ inputs.environment }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ vars.GRAFANA_CONTAINER_APP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      IMAGE_REPOSITORY: ${{ vars.GRAFANA_IMAGE_REPOSITORY }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      # ============================================
      # Azure Login
      # ============================================

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # ============================================
      # Validate Configuration
      # ============================================

      - name: Validate Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AZURE_RESOURCE_GROUP" ]]; then
            echo "::error::AZURE_RESOURCE_GROUP is not configured"
            exit 1
          fi

          if [[ -z "$CONTAINER_APP_NAME" ]]; then
            echo "::error::GRAFANA_CONTAINER_APP is not configured"
            exit 1
          fi

          if [[ -z "$ACR_NAME" ]]; then
            echo "::error::ACR_NAME is not configured"
            exit 1
          fi

          if [[ -z "$IMAGE_REPOSITORY" ]]; then
            echo "::error::GRAFANA_IMAGE_REPOSITORY is not configured"
            exit 1
          fi

          if [[ -z "$IMAGE_TAG" ]]; then
            echo "::error::IMAGE_TAG is empty"
            exit 1
          fi

          echo "Deployment configuration validation successful"


      # ============================================
      # Display Configuration
      # ============================================

      - name: Display Deployment Configuration
        shell: bash
        run: |
          echo "Environment      : ${{ inputs.environment }}"
          echo "Resource Group   : $AZURE_RESOURCE_GROUP"
          echo "Container App    : $CONTAINER_APP_NAME"
          echo "ACR              : $ACR_NAME"
          echo "Image Repository : $IMAGE_REPOSITORY"
          echo "Image Tag        : $IMAGE_TAG"


      # ============================================
      # Verify Target Container App
      # ============================================

      - name: Verify Target Container App
        shell: bash
        run: |
          set -euo pipefail

          az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{
              name:name,
              provisioningState:properties.provisioningState,
              currentImage:properties.template.containers[0].image
            }" \
            --output table


      # ============================================
      # Capture Current Image
      # ============================================

      - name: Capture Current Image
        id: current
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          echo "Current image: $CURRENT_IMAGE"

          echo "current_image=$CURRENT_IMAGE" >> "$GITHUB_OUTPUT"


      # ============================================
      # Build Target Image Name
      # ============================================

      - name: Build Target Image
        id: target
        shell: bash
        run: |
          set -euo pipefail

          TARGET_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"

          echo "Target image: $TARGET_IMAGE"

          echo "target_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"


      # ============================================
      # Deploy
      # ============================================

      - name: Deploy Container Image
        shell: bash
        run: |
          set -euo pipefail

          TARGET_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"

          echo "Deploying:"
          echo "$TARGET_IMAGE"

          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$TARGET_IMAGE" \
            --output none

          echo "Container App update command completed"


      # ============================================
      # Validate Deployment
      # ============================================

      - name: Validate Deployment
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_IMAGE="$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$IMAGE_TAG"

          DEPLOYED_IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" \
            --output tsv)

          PROVISIONING_STATE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.provisioningState" \
            --output tsv)

          LATEST_REVISION=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.latestRevisionName" \
            --output tsv)

          echo "Expected Image     : $EXPECTED_IMAGE"
          echo "Deployed Image     : $DEPLOYED_IMAGE"
          echo "Provisioning State : $PROVISIONING_STATE"
          echo "Latest Revision    : $LATEST_REVISION"

          if [[ "$DEPLOYED_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Deployment validation failed"
            exit 1
          fi

          if [[ "$PROVISIONING_STATE" != "Succeeded" ]]; then
            echo "::error::Container App provisioning state is $PROVISIONING_STATE"
            exit 1
          fi

          echo "Deployment validation successful"


      # ============================================
      # Deployment Summary
      # ============================================

      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Container App Deployment"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Resource Group | $AZURE_RESOURCE_GROUP |"
            echo "| Container App | $CONTAINER_APP_NAME |"
            echo "| ACR | $ACR_NAME |"
            echo "| Image Repository | $IMAGE_REPOSITORY |"
            echo "| Image Tag | $IMAGE_TAG |"
            echo "| Previous Image | ${{ steps.current.outputs.current_image }} |"
            echo "| Target Image | ${{ steps.target.outputs.target_image }} |"
          } >> "$GITHUB_STEP_SUMMARY"
